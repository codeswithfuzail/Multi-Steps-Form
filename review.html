<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Step 3: Your Review</title>
</head>

<body>

  <h2>Step 1: Account &nbsp;|&nbsp; Step 2: Personal Details &nbsp;|&nbsp; Step 3: Your Review</h2>

  <hr>

  <h1>Your Review</h1>

  <form action="thankyou.html" method="get">

    <p>
      How did you hear about us?<br>
      <select name="heard">
        <option>Select your option</option>
        <option>Social Media</option>
        <option>Friend / Referral</option>
        <option>Search Engine</option>
        <option>Advertisement</option>
      </select>
    </p>

    <p>
      Would you visit again?<br>
      <input type="radio" name="visit" value="Yes"> Yes
      <input type="radio" name="visit" value="No"> No
      <input type="radio" name="visit" value="Maybe"> Maybe
    </p>

    <p>
      Comments:<br>
      <textarea name="comments" rows="4" cols="40" placeholder="Enter your comments here..."></textarea>
    </p>

    <p>
      Documents:<br>
      <input type="file" name="docs">
    </p>

    <p>
      <input type="checkbox" name="updates" checked> Sign me up for email updates
    </p>

    <p>
      <a href="personal.html">Back</a> &nbsp;
      <input type="submit" value="Submit">
    </p>

  </form>

</body>

</html>
